<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>System</title>
  <link rel="stylesheet" href="../common.css">
  <style>
    .card {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .gauges {
      display: flex;
      justify-content: space-around;
    }

    .gauge {
      position: relative;
      width: 92px;
      height: 92px;
    }

    .gauge svg {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }

    .gauge circle {
      fill: none;
      stroke-width: 8;
    }

    .gauge .bg {
      stroke: rgba(255, 255, 255, 0.1);
    }

    .gauge .fg {
      stroke: var(--accent);
      stroke-linecap: round;
      stroke-dasharray: 238.76;
      stroke-dashoffset: 238.76;
      transition: stroke-dashoffset 0.6s ease, stroke 0.6s ease;
    }

    .gauge.warn .fg {
      stroke: #f0b232;
    }

    .gauge.hot .fg {
      stroke: #f23f43;
    }

    .gauge .readout {
      position: absolute;
      inset: 0;
      display: grid;
      place-content: center;
      text-align: center;
    }

    .gauge .value {
      font-size: 20px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .gauge .name {
      font-size: 10px;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="gauges">
      <div class="gauge" id="cpu">
        <svg viewBox="0 0 100 100"><circle class="bg" cx="50" cy="50" r="38"/><circle class="fg" cx="50" cy="50" r="38"/></svg>
        <div class="readout"><span class="value">0%</span><span class="name label">CPU</span></div>
      </div>
      <div class="gauge" id="mem">
        <svg viewBox="0 0 100 100"><circle class="bg" cx="50" cy="50" r="38"/><circle class="fg" cx="50" cy="50" r="38"/></svg>
        <div class="readout"><span class="value">0%</span><span class="name label">RAM</span></div>
      </div>
    </div>
    <div class="footer muted">
      <span id="memtext" class="ellipsis"></span>
      <span id="uptime"></span>
    </div>
  </div>
  <script src="../common.js"></script>
  <script src="system.js"></script>
</body>
</html>
