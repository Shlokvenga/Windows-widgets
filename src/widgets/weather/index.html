<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Weather</title>
  <link rel="stylesheet" href="../common.css">
  <style>
    .card {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .place {
      font-size: 14px;
      font-weight: 600;
    }

    .condition {
      font-size: 12px;
    }

    .emoji {
      font-size: 40px;
      line-height: 1;
      font-family: 'Segoe UI Emoji', sans-serif;
    }

    .temp-row {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }

    .temp {
      font-family: 'Segoe UI Variable Display', 'Segoe UI', system-ui, sans-serif;
      font-size: 44px;
      font-weight: 300;
      line-height: 1;
    }

    .details {
      display: flex;
      gap: 12px;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="top">
      <div>
        <div class="place ellipsis" id="place">Weather</div>
        <div class="condition muted" id="condition">Loading…</div>
      </div>
      <div class="emoji" id="emoji"></div>
    </div>
    <div class="temp-row">
      <span class="temp" id="temp">--°</span>
      <span class="muted" id="range"></span>
    </div>
    <div class="details muted" id="details"></div>
  </div>
  <script src="../common.js"></script>
  <script src="weather.js"></script>
</body>
</html>
